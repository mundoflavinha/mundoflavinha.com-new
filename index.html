    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      title é o único tag aqui que fica: document.title é sobrescrito
      diretamente (sem duplicar) pelo Helmet a cada rota (src/components/Seo.tsx).
      description/og:*/twitter:card NÃO ficam aqui de propósito — o
      react-helmet-async só GERENCIA tags que ele mesmo criou; um valor estático
      aqui viraria uma segunda tag duplicada nunca removida, e buscadores usam a
      PRIMEIRA ocorrência — a genérica estática, não a específica da rota. Isso
      tornaria o SEO por rota (issue #10) cosmético, sem efeito real.
    -->
    <title>Mundo Flavinha — Menos telas, mais infância</title>
  </head>
