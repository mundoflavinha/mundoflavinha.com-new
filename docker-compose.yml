services:
  mundoflavinha:
    build:
      context: .
      dockerfile: Dockerfile

    # Host 3002 -> Astro dev (4321) dentro do container.
    ports:
      - "3002:4321"

    volumes:
      - .:/app
      - node_modules_mundoflavinha:/app/node_modules

    environment:
      NODE_ENV: development
      # O bind mount não propaga eventos de filesystem no Docker Desktop;
      # sem polling o hot reload não dispara.
      CHOKIDAR_USEPOLLING: "true"

volumes:
  node_modules_mundoflavinha:
