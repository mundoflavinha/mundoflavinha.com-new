<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 235" role="img" aria-labelledby="title desc">
  <title id="title">Tapete de palha trançada</title>
  <desc id="desc">Tapete redondo de fibra natural, visto em perspectiva rasa.</desc>
  <!--
    Peça ADICIONADA ao kit, na mesma linguagem das outras.

    A razão da elipse (105/352 = 0,30) foi medida no tapete fotográfico da
    header_ref.png, que tem 930x276px de palha — é a perspectiva da câmera do
    ensaio, ~17 graus acima do horizonte. Manter essa razão é o que faz o
    recorte da família parecer apoiado, e não colado por cima.

    Os anéis são FAIXAS PREENCHIDAS (elipse externa + interna com fill-rule
    evenodd), não traços. Traço de espessura constante não serve aqui: numa
    elipse de razão 0,30 os anéis ficam a 8px de distância na frente e atrás,
    mas a 27px nas laterais — um stroke grosso o bastante para as laterais
    vira borrão na frente. A faixa preenchida comprime sozinha onde a
    perspectiva comprime, que é como a corda enrolada se comporta de verdade.

    Já o tracejado da trama tem passo CONSTANTE: num tapete de corda enrolada
    o gomo tem tamanho fixo, então os anéis internos só têm MENOS gomos, não
    gomos menores.
  -->
  <defs>
    <radialGradient id="luz" cx=".40" cy=".34" r=".82">
      <stop stop-color="var(--mf-straw-luz, #F6E7C9)" stop-opacity=".85"/>
      <stop offset=".55" stop-color="var(--mf-straw-luz, #F6E7C9)" stop-opacity=".18"/>
      <stop offset="1" stop-color="var(--mf-straw-borda, #B8965F)" stop-opacity=".30"/>
    </radialGradient>
    <filter id="shadow" x="-8%" y="-30%" width="116%" height="185%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6b4a2a" flood-opacity=".22"/>
    </filter>
  </defs>
