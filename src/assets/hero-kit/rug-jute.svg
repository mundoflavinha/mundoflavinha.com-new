<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 168" role="img" aria-labelledby="title desc">
  <title id="title">Tapete de palha trançada</title>
  <desc id="desc">Tapete redondo de fibra natural, visto em perspectiva rasa.</desc>
  <!--
    Peça ADICIONADA ao kit, na mesma linguagem das outras.

    A razão da elipse (0,213) foi MEDIDA na referência, não estimada: a
    família foi localizada no quadro por casamento de silhueta contra a
    diferença entre a composta e a base sem família, e o tapete foi lido em
    grade sobre a base. Os dois batem — a silhueta casou com proporção 1,081
    contra 1,079 do recorte, o que confirma a escala encontrada.

    Uma versão anterior usou 0,298, tirada da altura VISÍVEL da palha. Aquilo
    subestimava o achatamento porque o fundo do tapete está coberto pelos
    blobs: media-se um pedaço da elipse como se fosse ela inteira.

    Os anéis são FAIXAS PREENCHIDAS (elipse externa + interna, fill-rule
    evenodd), não traços. Traço de espessura constante não serve: nesta razão
    os anéis ficam a poucos pixels na frente e atrás, mas a dezenas nas
    laterais — um stroke grosso o bastante para as laterais vira borrão na
    frente. A faixa comprime sozinha onde a perspectiva comprime.

    O tracejado da trama tem passo CONSTANTE: num tapete de corda enrolada o
    gomo tem tamanho fixo, então os anéis internos têm MENOS gomos, não gomos
    menores.
  -->
  <defs>
    <radialGradient id="luz" cx=".40" cy=".34" r=".82">
      <stop stop-color="var(--mf-straw-luz, #F6E7C9)" stop-opacity=".85"/>
      <stop offset=".55" stop-color="var(--mf-straw-luz, #F6E7C9)" stop-opacity=".18"/>
      <stop offset="1" stop-color="var(--mf-straw-borda, #B8965F)" stop-opacity=".30"/>
    </radialGradient>
    <filter id="shadow" x="-8%" y="-45%" width="116%" height="210%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#6b4a2a" flood-opacity=".22"/>
    </filter>
  </defs>
