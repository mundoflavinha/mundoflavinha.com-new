<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" role="img" aria-labelledby="title desc">
  <title id="title">Bola de massinha verde</title>
  <desc id="desc">Bola de massinha verde com textura artesanal.</desc>
  <defs>
    <radialGradient id="clay" cx="0" cy="0" r="1" gradientTransform="translate(61 51) rotate(48) scale(113)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72d0a7"/><stop offset=".58" stop-color="#32a779"/><stop offset="1" stop-color="#1d7b59"/>
    </radialGradient>
    <filter id="texture" x="-20%" y="-20%" width="140%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="3" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feDropShadow in="rough" dx="0" dy="9" stdDeviation="7" flood-color="#1d654d" flood-opacity=".23"/>
    </filter>
  </defs>
  <circle data-part="clay" cx="85" cy="80" r="58" fill="url(#clay)" stroke="#247b5c" stroke-width="4" filter="url(#texture)"/>
  <g data-part="marks" fill="none" stroke="#157051" stroke-width="3" stroke-linecap="round" opacity=".32">
    <path d="M50 58c13-9 26-12 38-10M61 104c19 7 36 6 50-2M105 58c9 6 14 13 17 22"/>
  </g>
  <path d="M50 47c12-11 28-16 41-13" fill="none" stroke="#a4e2c8" stroke-width="5" stroke-linecap="round" opacity=".5"/>
</svg>
