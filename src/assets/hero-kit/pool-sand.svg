<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">Mancha de apoio</title>
  <desc id="desc">Forma orgânica clara que dá peso visual sob a família.</desc>
  <!--
    Alternativa ao tapete. A pose da família é suspensa — todos os pés estão
    em ponta, ninguém apoia — então um plano de chão em perspectiva entra em
    contradição com ela: os pés passam a pairar sobre o piso.
    Esta forma não afirma plano nenhum. É da mesma família de papel recortado
    dos blobs, só que larga e rasa, e serve de peso visual sem prometer
    uma superfície que a foto não sustenta.
  -->
  <defs>
    <radialGradient id="areia" cx=".46" cy=".40" r=".72">
      <stop stop-color="var(--mf-areia-luz, #F0E2C8)"/>
      <stop offset="1" stop-color="var(--mf-areia, #E2CFAC)"/>
    </radialGradient>
    <filter id="grao" x="-8%" y="-20%" width="116%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="5" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="gs"><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
      <feComposite in="gs" in2="SourceAlpha" operator="in" result="gr"/>
      <feBlend in="SourceGraphic" in2="gr" mode="multiply"/>
    </filter>
  </defs>
  <path data-part="mancha" filter="url(#grao)" fill="url(#areia)"
    d="M92 138C52 112 60 74 108 56c53-20 118-14 186-20 74-7 121-24 197-21 71 3 133 15 187 40 48 22 96 47 84 78-13 33-88 40-152 51-77 13-135 30-222 32-79 2-146-9-208-30-33-11-63-25-88-48Z"/>
  <path data-part="luz" fill="none" stroke="var(--mf-areia-luz, #F7EEDC)" stroke-width="7" stroke-linecap="round" opacity=".55"
    d="M150 92c76-30 178-30 268-28"/>
</svg>
