name: CI

# Até agora nada barrava código quebrado: `npm run build` roda só `vite build`,
# que transpila com SWC e NÃO verifica tipos. Erro de tipo ou lint só apareceria
# em produção. Este workflow é a trava que faltava.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # --max-warnings 0 de propósito: warning que ninguém corrige vira ruído
      # e some no meio dos outros. Hoje o projeto está em zero.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Depende do build: estas asserções leem o HTML realmente gerado em dist/.
      - name: Testes sobre o HTML gerado
        run: npm run test:html

      # As quatro classes de defeito que nada acima alcança: corrida de
      # hidratação, foco/teclado, chunk que não carrega e submissão de
      # formulário antes de o JavaScript assumir. Vitest roda em Node, sem
      # navegador; os testes de dist/ leem HTML parado. Nenhum dos dois vê
      # hidratação acontecer — e é exatamente ali que mora a ponte do modal.
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      # Com o ID, o build emite as tags inertes do Analytics e os testes de
      # bloqueio prévio têm o que exercitar. Sem ele, esses testes se marcam
      # como pulados — e o buraco passaria despercebido justamente na coisa que
      # mais precisa de prova. O valor é público (aparece no HTML de qualquer
      # site com GA), então não é segredo de CI.
      - name: Testes de ponta a ponta
        run: npm run test:e2e
        env:
          PUBLIC_GA_ID: G-452LR8P42T

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
